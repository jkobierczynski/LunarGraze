name: Windows release

# Builds a ready-to-run LunarGraze.exe (statically linked against graze_core,
# with the Qt6 DLLs it needs bundled alongside it via windeployqt) on every
# push/PR for CI verification, and additionally attaches the packaged zip to
# a GitHub Release when a "v*" tag is pushed (e.g. v1.0.0).
#
# This exists because the LunarGraze source is portable, dependency-light
# C++/Qt with no POSIX-only calls, but actually producing a Windows build
# needs a real Windows toolchain + Qt-for-Windows -- this workflow supplies
# both via a Windows GitHub Actions runner, so nobody has to install Qt
# locally just to get a working .exe.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    # softprops/action-gh-release needs write access to create/update the
    # release and attach files -- without this, many repos' default
    # GITHUB_TOKEN permissions are read-only and it fails with "Resource
    # not accessible by integration" on the update-a-release call (as seen
    # when this ran against an already-existing release the Linux job had
    # just created for the same tag).
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.*"
          arch: win64_msvc2019_64
          cache: true

      # Ninja instead of an explicit "-G Visual Studio NN 20XX" generator:
      # pinning a specific VS generator name breaks outright the moment
      # GitHub's windows-latest image moves to a different bundled VS
      # version (exactly what happened here -- "could not find any
      # instance of Visual Studio" the first time this workflow ran).
      # Ninja just needs a cl.exe on PATH, so it doesn't care which VS
      # version that is; msvc-dev-cmd finds whatever's installed and wires
      # up the environment for it.
      - name: Set up MSVC build environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Not reliably preinstalled on windows-latest -- it was silently
      # dropped from the runner image once already (actions/runner-images
      # #8343). pip's wheel is the simplest way to pin it ourselves instead
      # of hoping it's still there.
      - name: Install Ninja
        run: pip install ninja

      - name: Configure (CMake)
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Build
        run: cmake --build build --parallel

      - name: Smoke test graze_core_test (headless, no Qt needed)
        shell: pwsh
        run: |
          Copy-Item hygdata_v41.csv,area_eph_2025_2030.txt build\
          Push-Location build
          .\graze_core_test.exe --lat 50.85 --lon 4.35 --radius-km 100 --mag-limit 6 `
            --start 2026-01-01 --end 2026-02-01 --catalog hygdata_v41.csv --eph area_eph_2025_2030.txt
          if ($LASTEXITCODE -ne 0) { throw "graze_core_test exited with code $LASTEXITCODE" }
          Pop-Location

      - name: Package (windeployqt + bundled data)
        shell: pwsh
        run: |
          $dist = "dist\LunarGraze-windows-x64"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item build\LunarGraze.exe $dist\
          # jurplel/install-qt-action puts Qt's bin dir (windeployqt.exe
          # included) on PATH itself -- no need to build the path by hand
          # from an env var (the previous attempt guessed the wrong one,
          # "Qt6_DIR", which this action never actually sets; the real one
          # is QT_ROOT_DIR, but PATH already covers it either way).
          $windeployqt = Get-Command windeployqt.exe -ErrorAction SilentlyContinue
          if (-not $windeployqt) { throw "windeployqt.exe not found on PATH -- Qt install step may have failed" }
          & $windeployqt.Source "$dist\LunarGraze.exe" --release --no-translations --no-opengl-sw --no-system-d3d-compiler
          if ($LASTEXITCODE -ne 0) { throw "windeployqt exited with code $LASTEXITCODE" }
          Copy-Item hygdata_v41.csv,area_eph_2025_2030.txt,README.md,LICENSE $dist\
          Compress-Archive -Path $dist -DestinationPath LunarGraze-windows-x64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LunarGraze-windows-x64
          path: LunarGraze-windows-x64.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LunarGraze-windows-x64.zip
